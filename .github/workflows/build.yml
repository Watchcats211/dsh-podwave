name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Issue #1：默认模型必须按真实平台算、verify() 必须比对真实模型而不是只判非空。
      # 单元测试用的是伪造的 platform 对象，这一步跑的是 detectPlatform() 的真实结果。
      - name: 校验 Windows 平台默认模型与安装检查
        if: matrix.os == 'windows-latest'
        run: node test/ci/windows-platform-check.mjs

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install sherpa-onnx numpy
      - name: 用插件下载器拉取 SenseVoice（国内线路）
        run: node test/ci/download-sensevoice.mjs
      - name: 生成测试语音（Windows SAPI，16k 单声道）
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $synth.SetOutputToWaveFile("$PWD\test-speech.wav", $format)
          $synth.Speak("Hello, this is a test of the podcast transcription pipeline.")
          $synth.Dispose()
      - name: 运行 sherpa-onnx 转写
        shell: pwsh
        run: python scripts/asr_sherpa_batch.py test-speech.wav --model-dir "$env:USERPROFILE\.podwave\models\sensevoice-small-int8" --out-dir out
      - name: 校验转写结果
        run: node test/ci/assert-transcript.mjs
      - name: 下载 llama.cpp 并校验可执行
        run: node test/ci/llama-check.mjs
      # Issue #1 的 #5：非 zip 压缩包解压（GNU tar 绝对路径陷阱）在真 Windows 上必须可用。
      - name: 校验压缩包解压与路径安全检查
        run: node test/ci/windows-archive-check.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
